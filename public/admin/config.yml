backend:
  name: github
  repo: ferienwohnungsverein-jungfrau/ferienwohnung-oberland-website
  branch: main
  # Login läuft über den eigenen OAuth-Vermittler auf dem CH-Server
  # (public/admin/oauth/), erreichbar über die Redaktions-Subdomain.
  base_url: https://login.ferienwohnungsverein-jungfrau.ch
  auth_endpoint: oauth/auth.php
  commit_messages:
    create: "Redaktion: {{collection}} «{{slug}}» erstellt"
    update: "Redaktion: {{collection}} «{{slug}}» geändert"
    delete: "Redaktion: {{collection}} «{{slug}}» gelöscht"
    uploadMedia: "Redaktion: Datei {{path}} hochgeladen"
    deleteMedia: "Redaktion: Datei {{path}} gelöscht"

# Oberfläche auf Deutsch, Vereins-Logo auf dem Login-Bildschirm
locale: de
logo_url: https://ferienwohnungsverein-jungfrau.ch/favicon-192.png

# Live-Vorschau der Astro-Seite direkt im CMS (optional, kann leer bleiben)
site_url: https://ferienwohnungsverein-jungfrau.ch
display_url: https://ferienwohnungsverein-jungfrau.ch

# Zweisprachig: jeder Eintrag hat eine deutsche und eine englische Fassung
# (Umschalter oben im Eintrag). Dateien liegen unter <ordner>/de/ und <ordner>/en/.
i18n:
  structure: multiple_folders
  locales: [de, en]
  default_locale: de

media_folder: "public/images"
public_folder: "/images"

# Bild-Standard: beim Upload auf max. 1920 px verkleinern und als WebP ablegen.
media_libraries:
  default:
    config:
      max_file_size: 10485760
      transformations:
        raster_image:
          format: webp
          quality: 75
          width: 1920
          height: 1920

collections:
  - name: "seiten"
    label: "Seiten-Texte"
    description: "Textblöcke fest gestalteter Seiten. Layout, Bilder und Knöpfe bleiben wie sie sind."
    i18n:
      structure: multiple_folders
    files:
      - name: "startseite"
        label: "Startseite"
        file: "src/content/seiten/{{locale}}/startseite.json"
        i18n: true
        fields:
          - { label: "Einleitungssatz unter dem Titel", name: "hero_subline", widget: "text", i18n: true }
          - { label: "Mitglieder-Zitat", name: "zitat", widget: "text", i18n: true }
          - { label: "Zitat – Name/Betrieb", name: "zitat_autor", widget: "string", i18n: true }
          - { label: "Zitat – Link (optional)", name: "zitat_link", widget: "string", required: false, i18n: "duplicate" }
      - name: "ueber-uns"
        label: "Über uns"
        file: "src/content/seiten/{{locale}}/ueber-uns.json"
        i18n: true
        fields:
          - { label: "Satz unter «Wer wir sind»", name: "hero_text", widget: "text", i18n: true }
          - { label: "Einleitung zum Vorstand", name: "vorstand_intro", widget: "markdown", i18n: true, minimal: true, buttons: [bold, italic, link] }
          - { label: "Abschnitt 1 – Titel", name: "warum_titel", widget: "string", i18n: true }
          - { label: "Abschnitt 1 – Text", name: "warum_text", widget: "markdown", i18n: true, minimal: true, buttons: [bold, italic, link, bulleted-list] }
          - { label: "Abschnitt 2 (neben Video) – Titel", name: "einsatz_titel", widget: "string", i18n: true }
          - { label: "Abschnitt 2 – Text", name: "einsatz_text", widget: "markdown", i18n: true, minimal: true, buttons: [bold, italic, link, bulleted-list] }
          - { label: "Abschnitt 3 – Titel", name: "rollen_titel", widget: "string", i18n: true }
          - { label: "Abschnitt 3 – Text", name: "rollen_text", widget: "markdown", i18n: true, minimal: true, buttons: [bold, italic, link, bulleted-list] }

  - name: "vorstand"
    label: "Vorstand"
    description: "Wird unter «Über uns» angezeigt (Reihenfolge wie hier)."
    files:
      - name: "vorstand"
        label: "Vorstandsmitglieder"
        file: "src/data/vorstand.json"
        fields:
          - label: "Mitglieder"
            name: "vorstand"
            widget: "list"
            summary: "{{rolle}} – {{name}}"
            fields:
              - { label: "Rolle", name: "rolle", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Ort (PLZ Ort, optional)", name: "ort", widget: "string", required: false }
              - { label: "Standardmässig geöffnet anzeigen", name: "offen", widget: "boolean", default: false }

  - name: "kontakt"
    label: "Kontakt"
    description: "Telefon und Presse-Mail; erscheinen auf Kontakt, Mitgliedschaft und in den Suchmaschinen-Daten."
    files:
      - name: "kontakt"
        label: "Kontaktdaten"
        file: "src/data/kontakt.json"
        fields:
          - { label: "E-Mail Presseanfragen", name: "presseEmail", widget: "string" }
          - { label: "Vereinstelefon (Anzeige, z.B. 078 319 59 71)", name: "vereinsTelefon", widget: "string" }
          - { label: "Vereinstelefon (Link-Format, z.B. +41783195971)", name: "vereinsTelefonLink", widget: "string", pattern: ['^\+\d{6,15}$', 'Format: +41 gefolgt von den Ziffern ohne Leerzeichen'] }

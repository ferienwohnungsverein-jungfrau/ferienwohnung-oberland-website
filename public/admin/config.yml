backend:
  name: github
  repo: ferienwohnungsverein-jungfrau/ferienwohnung-oberland-website
  branch: main
  # Login läuft über den eigenen OAuth-Vermittler auf dem CH-Server
  # (public/admin/oauth/), erreichbar über die Redaktions-Subdomain.
  base_url: https://login.ferienwohnungsverein-jungfrau.ch
  auth_endpoint: oauth/auth.php

# Bild-Standard: beim Upload auf max. 1920 px verkleinern und als WebP ablegen.
media_libraries:
  default:
    config:
      max_file_size: 10485760
      transformations:
        raster_image:
          format: webp
          quality: 75
          width: 1920
          height: 1920

# Oberfläche auf Deutsch, Vereins-Logo auf dem Login-Bildschirm
locale: de
logo_url: https://ferienwohnungsverein-jungfrau.ch/favicon-192.png

# Live-Vorschau der Astro-Seite direkt im CMS (optional, kann leer bleiben)
site_url: https://ferienwohnungsverein-jungfrau.ch

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "vorstand"
    label: "Vorstand"
    files:
      - name: "vorstand"
        label: "Vorstandsmitglieder"
        file: "src/data/vorstand.json"
        fields:
          - label: "Mitglieder"
            name: "vorstand"
            widget: "list"
            summary: "{{rolle}} – {{name}}"
            fields:
              - { label: "Rolle", name: "rolle", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Ort (PLZ Ort)", name: "ort", widget: "string" }
              - { label: "Standardmässig geöffnet anzeigen", name: "offen", widget: "boolean", default: false }

  - name: "kontakt"
    label: "Kontakt"
    files:
      - name: "kontakt"
        label: "Kontaktdaten"
        file: "src/data/kontakt.json"
        fields:
          - { label: "E-Mail Presseanfragen", name: "presseEmail", widget: "string" }
          - { label: "Vereinstelefon (Anzeige, z.B. 078 319 59 71)", name: "vereinsTelefon", widget: "string" }
          - { label: "Vereinstelefon (Link-Format, z.B. +41783195971)", name: "vereinsTelefonLink", widget: "string" }
